async function save(col,o){if(col==="tasks"){o.semana=wk(o.venc);o.temporada=temp(o.venc);o.respTxt=names(o)}if(col==="cfg")cfg={...o};else{const a=col==="tasks"?tasks:col==="actas"?actas:people,i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o}persist();render();if(remote)try{await api("upsert",col,{item:o});setErr("")}catch(e){setErr("No se pudo guardar en la base de datos: "+e.message)}}
async function del(col,id){people=people.filter(x=>x.id!==id);persist();render();if(remote)try{await api("delete",col,{id})}catch(e){setErr("No se pudo eliminar: "+e.message)}}
async function load(){try{const rows=await api("list","all"),ts=[],ps=[],as=[];if(!Array.isArray(rows))throw new Error("respuesta inválida");let c=null;rows.forEach(r=>{let d;try{d=JSON.parse(r.d)}catch(e){return}if(r.e==="tasks")ts.push(d);else if(r.e==="people")ps.push(d);else if(r.e==="actas")as.push(d);else if(r.e==="cfg")c=d});actas=as.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||(b.num||"").localeCompare(a.num||""));tasks=ts;people=ps.sort((a,b)=>a.name.localeCompare(b.name));if(c)cfg={roomUrl:"",...c};setErr("");if(!$("dlg").open&&tab!=="Reunión")render()}catch(e){setErr("Sin conexión con la base de datos: "+e.message)}}
const slug=n=>n.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,""),title=n=>n.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const iso=v=>!v?"":v instanceof Date?new Date(v.getTime()+432e5).toISOString().slice(0,10):String(v).slice(0,10);
async function importRows(rows){let n=0;for(const r of rows){if(!r.tema)continue;const nm=String(r.responsable||"").split("/").map(s=>s.trim()).filter(Boolean),todos=nm.some(x=>x.toUpperCase()==="TODOS"),ids=[];
for(const x of nm){if(x.toUpperCase()==="TODOS")continue;const id="p_"+slug(x);ids.push(id);if(!people.some(p=>p.id===id))await save("people",{id,name:title(x),email:""})}
let prog=+r.progreso||0;if(prog<=1)prog=Math.round(prog*100);const e=String(r.estado||"").trim(),estado=ESTADOS[e]?e:"Por hacer",p=String(r.prioridad||"").toLowerCase(),nd=NEEDS.includes(estado);
await save("tasks",{id:"x"+r.id,title:r.tema,desc:r.descripcion||"",resps:ids,todos,cat:"Otro",estado,prio:p==="alta"?"Alta":p==="baja"?"Baja":"Normal",inicio:iso(r.inicio),fin:"",venc:iso(r.vence),prog,motivoTipo:nd?"Otro":"",motivo:nd?"Importado sin motivo: completar":"",hist:[{f:iso(r.inicio)||today(),x:"Importada del Excel"}]});n++}return n}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=()=>ko(new Error("No se pudo cargar el lector de Excel"));document.head.appendChild(s)})}
async function importFile(inp){const f=inp.files[0];if(!f)return;try{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),ws=wb.Sheets["Actividades"]||wb.Sheets[wb.SheetNames[0]];alert((await importRows(XLSX.utils.sheet_to_json(ws)))+" actividades importadas")}catch(e){alert(e.message)}inp.value=""}
async function loadSeed(){alert((await importRows(SEED))+" actividades cargadas del Excel original")}
function filt(){return tasks.filter(t=>!t.archivada&&(!F.resp||(t.resps||[]).includes(F.resp)||t.todos)&&(!F.prio||t.prio===F.prio)&&(!F.temp||temp(t.venc)===F.temp)&&(!F.sem||wk(t.venc)===F.sem)&&(!F.mes||(t.venc||"").startsWith(F.mes)))}
const opts=(a,v,all)=>(all?`<option value="">${all}</option>`:"")+a.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
function filters(){return `<div class="filters"><div class="seg"><button onclick="step('t',-1)" title="Temporada anterior">◀</button><select onchange="F.temp=this.value;F.sem='';render()">${seasons().map(x=>`<option value="${x}" ${x===F.temp?"selected":""}>Temporada ${x}</option>`).join("")}</select><button onclick="step('t',1)" title="Temporada siguiente">▶</button></div>
<div class="seg"><button onclick="stepW(-1)" title="Semana anterior">◀</button><select onchange="F.sem=this.value;render()"><option value="">Toda la temporada</option>${weeksOf(F.temp).map(([k,d])=>`<option value="${k}" ${k===F.sem?"selected":""}>${k} · ${fd(d).slice(0,5)}–${fd(plus(d,6)).slice(0,5)}</option>`).join("")}</select><button onclick="stepW(1)" title="Semana siguiente">▶</button></div><button class="btn" onclick="goToday()">Hoy</button>
<select onchange="F.resp=this.value;render()"><option value="">Todos los responsables</option>${people.map(p=>`<option value="${p.id}" ${F.resp===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select><select onchange="F.prio=this.value;render()">${opts(PRIOS,F.prio,"Toda prioridad")}</select><input type="month" value="${F.mes}" onchange="F.mes=this.value;render()" title="Solo mes (útil en la pestaña Mes)"></div>`}
function kpis(l){const a=l.filter(t=>t.estado!=="Cancelado"),h=a.filter(t=>t.estado==="Hecho"),ot=h.filter(t=>t.cierre&&t.venc&&t.cierre<=t.venc);
const k=[[l.length,"Actividades"],[(a.length?Math.round(h.length/a.length*100):0)+"%","Cumplimiento"],[h.length?Math.round(ot.length/h.length*100)+"%":"—","Cierre a tiempo"],[(a.length?Math.round(a.reduce((s,t)=>s+(+t.prog||0),0)/a.length):0)+"%","Avance promedio"],[l.filter(late).length,"Vencidas"],[l.filter(t=>t.estado==="Bloqueado").length,"Bloqueadas"]];
return `<div class="kpis">${k.map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>`}
function card(t){const nd=NEEDS.includes(t.estado);return `<div class="card" style="--c:${ESTADOS[t.estado]}" onclick="edit('${t.id}')"><div class="ct">${esc(t.title)}</div><div class="cm">${avs(t)}${t.prio==="Alta"?'<span class="hi">ALTA</span>':""}<span class="${late(t)?"late":""}">${fd(t.venc).slice(0,5)}${late(t)?" ⚠":""}</span></div><div class="bar"><i style="width:${+t.prog||0}%"></i></div>${nd&&t.motivo?`<div class="motivo"><b>${esc(t.motivoTipo)}</b>: ${esc(t.motivo)}</div>`:""}</div>`}
const bars=(a,m,col)=>a.map(([n,v])=>`<div class="hbar"><span>${esc(n)}</span><div><i style="width:${v/m*100}%;background:${col?col(n):"var(--blue)"}"></i></div><b>${v}</b></div>`).join("")||'<span class="mut">Sin datos</span>';
const views={
Tablero(){const l=filt();return (!tasks.length?`<div class="panel"><b>Aún no hay actividades.</b> Carga la base del Excel original o crea la primera.<br><br><button class="btn s" onclick="loadSeed()">Cargar las ${SEED.length} actividades del Excel</button></div>`:"")+filters()+`<div class="board">${Object.keys(ESTADOS).map(e=>{const x=l.filter(t=>t.estado===e);return `<div class="col" style="--c:${ESTADOS[e]}"><h3><span>${e}</span><em>${x.length}</em></h3>${x.map(card).join("")||'<div class="empty">Sin actividades</div>'}</div>`}).join("")}</div>`},
Mes(){const m=F.mes||today().slice(0,7),l=tasks.filter(t=>!t.archivada&&(t.venc||"").startsWith(m)&&(!F.resp||(t.resps||[]).includes(F.resp)||t.todos));
return filters()+`<div class="panel"><b>Revisión mensual · ${m}</b> <span class="mut">Lo no ejecutado muestra su motivo para decidir si ya se puede reprogramar.</span><table><tr><th>Vence</th><th>Actividad</th><th>Responsable</th><th>Estado</th><th>Avance</th><th>Motivo</th></tr>${l.sort((a,b)=>a.venc.localeCompare(b.venc)).map(t=>`<tr onclick="edit('${t.id}')" style="cursor:pointer"><td>${fd(t.venc)}<br><span class="mut">${wk(t.venc)}</span></td><td><b>${esc(t.title)}</b></td><td>${esc(names(t))}</td><td><span class="tag" style="background:${ESTADOS[t.estado]}">${t.estado}</span></td><td>${t.prog||0}%</td><td>${NEEDS.includes(t.estado)?esc(t.motivoTipo+": "+t.motivo):""}</td></tr>`).join("")||'<tr><td colspan=6>Sin actividades en este mes</td></tr>'}</table></div>`},
Indicadores(){const l=filt(),es=Object.keys(ESTADOS),mot={};l.filter(t=>NEEDS.includes(t.estado)).forEach(t=>{const k=t.motivoTipo||"Sin motivo";mot[k]=(mot[k]||0)+1});
const sem={};l.forEach(t=>{const k=wk(t.venc);(sem[k]=sem[k]||[0,0])[0]++;if(t.estado==="Hecho")sem[k][1]++});
return filters()+`<div class="panel"><b>Actividades por estado</b>${bars(es.map(e=>[e,l.filter(t=>t.estado===e).length]),Math.max(1,...es.map(e=>l.filter(t=>t.estado===e).length)),n=>ESTADOS[n])}</div>
<div class="panel"><b>Motivos de no ejecución</b>${bars(Object.entries(mot),Math.max(1,...Object.values(mot)))}</div>
<div class="panel"><b>Cumplimiento por semana</b><table>${Object.keys(sem).sort().map(k=>`<tr><td>${k}</td><td>${sem[k][0]} act.</td><td>${sem[k][1]} hechas</td><td>${Math.round(sem[k][1]/sem[k][0]*100)}%</td></tr>`).join("")||"<tr><td>Sin datos</td></tr>"}</table></div>
<div class="panel"><b>Resultados por responsable</b><table>${people.map(p=>{const x=l.filter(t=>(t.resps||[]).includes(p.id));return `<tr><td>${esc(p.name)}</td><td>${x.length} act.</td><td>${x.filter(t=>t.estado==="Hecho").length} hechas</td><td>${x.length?Math.round(x.filter(t=>t.estado==="Hecho").length/x.length*100):0}%</td></tr>`}).join("")||"<tr><td>Sin datos</td></tr>"}</table></div>`},
Reunión(){if(!cur)cur=draftA();const d=cur,open=tasks.filter(t=>!t.archivada).sort((a,b)=>a.title.localeCompare(b.title)),po=v=>`<option value="">Responsable</option>`+people.map(p=>`<option value="${p.id}" ${v===p.id?"selected":""}>${esc(p.name)}</option>`).join("");
const cbRow=(c,i)=>`<div class="cbw"><div class="arow ar2"><select class="cs"><option value="">Elige una actividad</option>${open.map(t=>`<option value="${t.id}" ${c.id===t.id?"selected":""}>${esc(t.title)} · ${t.estado}</option>`).join("")}</select><select class="ce" onchange="this.closest('.cbw').querySelector('.cx').style.display=NEEDS.includes(this.value)?'grid':'none'">${opts(Object.keys(ESTADOS),c.e||"En curso")}</select><input class="cp" type="number" min="0" max="100" value="${c.p??""}" placeholder="% avance"><button class="btn d" onclick="delC(${i})">Quitar</button></div><div class="arow cx" style="display:${NEEDS.includes(c.e)?"grid":"none"};grid-template-columns:1fr 2fr"><select class="cmt">${opts(MOTIVOS,c.mt)}</select><input class="cm" value="${esc(c.m||"")}" placeholder="Motivo (obligatorio): qué falta para retomarla"></div></div>`;
return `<div class="panel"><b>Datos de la reunión</b><div class="row2"><div><label>Título</label><input id="a_titulo" value="${esc(d.titulo)}"></div><div><label>Fecha</label><input id="a_fecha" type="date" value="${d.fecha}"></div><div><label>Hora de inicio</label><input id="a_hi" type="time" value="${d.hi}"></div><div><label>Hora de fin</label><input id="a_hf" type="time" value="${d.hf}"></div></div><label>Lugar o sala</label><input id="a_lugar" value="${esc(d.lugar)}" placeholder="Sala de reuniones">
<label>Enlace de reserva de sala (tu app de Power Apps)</label><div style="display:flex;gap:8px"><input id="ru" value="${esc(cfg.roomUrl)}" placeholder="https://apps.powerapps.com/..." style="flex:1"><button class="btn s" onclick="saveRoom()">Guardar</button>${cfg.roomUrl?`<a class="btn s" href="${esc(cfg.roomUrl)}" target="_blank" rel="noopener" style="text-decoration:none">Reservar</a>`:""}</div></div>
<div class="panel"><b>Asistentes</b> <span class="mut">Marca quién asistió. Las personas se agregan en la pestaña Responsables.</span><div class="chk" style="margin-top:6px">${people.map(p=>`<label><input type="checkbox" class="pc" data-id="${p.id}" ${d.pres[p.id]!==false?"checked":""}> ${esc(p.name)}</label>`).join("")||'<span class="mut">Aún no hay responsables registrados.</span>'}</div></div>
<div class="panel"><b>Temas y avances</b><label>Temas tratados</label><textarea id="a_temas" rows="3" style="width:100%">${esc(d.temas)}</textarea><label>Avances y cambios</label><textarea id="a_avances" rows="3" style="width:100%">${esc(d.avances)}</textarea></div>
<div class="panel"><b>Actividades que cambian de estado</b> <span class="mut">Elige una actividad ya registrada y su nuevo estado. Al guardar el acta, la tarjeta cambia de columna.</span><div style="margin:8px 0">${d.cb.map(cbRow).join("")}</div><button class="btn s" onclick="addC()">Actualizar una actividad</button></div>
<div class="panel"><b>Acuerdos</b> <span class="mut">Cada acuerdo se crea como actividad en el tablero, con el estado que elijas.</span><div style="margin:8px 0">${d.ac.map((a,i)=>`<div class="arow ar1 ac"><input class="at" value="${esc(a.t)}" placeholder="Acuerdo o pendiente"><select class="ar">${po(a.r)}</select><select class="ae">${opts(NUEVOS,a.e)}</select><input class="af" type="date" value="${a.f||""}" title="Fecha límite"><button class="btn d" onclick="delA(${i})">Quitar</button></div>`).join("")}</div><button class="btn s" onclick="addA()">Agregar acuerdo</button>
<label>Próxima reunión</label><input id="a_prox" value="${esc(d.prox)}" placeholder="Ej.: lunes 12/10, 8:00 a. m." style="max-width:340px"></div>
<div class="panel"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn s" onclick="guardarActa()">Guardar acta</button><button class="btn s" onclick="pdfActa()">Generar acta en PDF</button><button class="btn" onclick="nuevaActa()">Nueva acta</button></div><div class="mut" style="margin-top:8px">En el cuadro de impresión elige "Guardar como PDF". El PDF se adjunta a mano en el correo.</div><div style="margin-top:8px">${mailHtml()}</div></div>
<div class="panel"><b>Actas guardadas</b> <span class="mut">No se eliminan: quedan como historial para todo el equipo.</span>${actas.map(h=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)"><span><b>${esc(h.num)}</b> · ${esc(h.titulo)} <span class="mut">${fd(h.fecha)}</span></span><button class="btn" onclick="abrirActa('${h.id}')">Abrir</button></div>`).join("")||'<div class="mut" style="margin-top:6px">Todavía no hay actas guardadas.</div>'}</div>`},

Responsables(){return `<div class="panel"><b>Responsables</b> <span class="mut">Una persona, un registro. El correo se usa para recordatorios.</span>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><input id="pn" placeholder="Nombre"><input id="pe" placeholder="Correo corporativo"><button class="btn s" onclick="addP()">Agregar</button></div>
<table>${people.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.email||"")}</td><td>${tasks.filter(t=>(t.resps||[]).includes(p.id)&&!["Hecho","Cancelado"].includes(t.estado)&&!t.archivada).length} abiertas</td><td><button class="btn d" onclick="delP('${p.id}')">Quitar</button></td></tr>`).join("")||"<tr><td>Aún no hay responsables</td></tr>"}</table></div>
<div class="panel"><b>Importar datos</b><br><span class="mut">Sube el Excel con las columnas originales (id, responsable, tema, descripcion, estado, prioridad, progreso, inicio, vence). Se puede repetir sin duplicar.</span><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><input type="file" accept=".xlsx,.csv" onchange="importFile(this)"><button class="btn s" onclick="loadSeed()">Cargar Excel original (${SEED.length})</button></div></div>`}};
function render(){if(hold)return;$("c1").textContent="Semana "+wk(today());$("c2").textContent="Temporada "+temp(today());
$("nav").innerHTML=Object.keys(views).map(k=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${k}</button>`).join("");
$("kp").innerHTML=kpis(filt());$("v").innerHTML=views[tab]();}
function edit(id){if(tab==="Reunión"&&cur&&$("a_titulo"))readActa();const t=tasks.find(x=>x.id===id)||{title:"",desc:"",resps:[],cat:CATS[0],estado:"Por hacer",prio:"Normal",inicio:today(),fin:"",venc:"",prog:0,hist:[]};
$("dlg").innerHTML=`<h3 style="margin-top:0">${id?"Editar":"Nueva"} actividad</h3><label>Título</label><input id="f_t" value="${esc(t.title)}"><label>Descripción</label><textarea id="f_d" rows="3">${esc(t.desc)}</textarea>
<label>Responsables (puede haber más de uno)</label><div class="chk">${people.map(p=>`<label><input type="checkbox" class="f_rc" value="${p.id}" ${(t.resps||[]).includes(p.id)?"checked":""}> ${esc(p.name)}</label>`).join("")}<label><input type="checkbox" id="f_td" ${t.todos?"checked":""}> <b>Todo el equipo</b></label></div>
<div class="row2"><div><label>Categoría</label><select id="f_c">${opts(CATS,t.cat)}</select></div><div><label>Prioridad</label><select id="f_p">${opts(PRIOS,t.prio)}</select></div>
<div><label>Estado</label><select id="f_e" onchange="$('mo').style.display=NEEDS.includes(this.value)?'block':'none'">${opts(Object.keys(ESTADOS),t.estado)}</select></div><div><label>Avance (0-100)</label><input type="number" min="0" max="100" id="f_a" value="${t.prog||0}"></div>
<div><label>Inicio</label><input type="date" id="f_i" value="${t.inicio||""}"></div><div><label>Vencimiento</label><input type="date" id="f_v" value="${t.venc||""}"></div></div>
<div id="mo" style="display:${NEEDS.includes(t.estado)?"block":"none"}"><label>Motivo (obligatorio)</label><select id="f_mt">${opts(MOTIVOS,t.motivoTipo)}</select><textarea id="f_m" rows="2" style="width:100%;margin-top:6px" placeholder="Detalle: qué falta para retomarla">${esc(t.motivo||"")}</textarea></div>
${(t.hist||[]).length?`<label>Historial</label><div class="mut">${t.hist.slice().reverse().map(h=>`${fd(h.f)}: ${esc(h.x)}`).join("<br>")}</div>`:""}
<div style="display:flex;justify-content:space-between;margin-top:14px"><span>${id?`<button class="btn d" onclick="arch('${id}')">Archivar</button>`:""}</span><span><button class="btn" onclick="$('dlg').close()">Cancelar</button> <button class="btn s" onclick="saveT('${id||""}')">Guardar</button></span></div>`;$("dlg").showModal()}
function saveT(id){const o=tasks.find(x=>x.id===id)||{id:uid(),hist:[]},v=i=>$(i).value,e=v("f_e"),nd=NEEDS.includes(e);
if(!v("f_t").trim())return alert("Falta el título");if(!v("f_v"))return alert("Falta la fecha de vencimiento");if(nd&&!v("f_m").trim())return alert("Indica el motivo de este estado");
const n={...o,title:v("f_t").trim(),desc:v("f_d"),resps:[...document.querySelectorAll(".f_rc:checked")].map(c=>c.value),todos:$("f_td").checked,cat:v("f_c"),estado:e,prio:v("f_p"),inicio:v("f_i"),venc:v("f_v"),prog:Math.min(100,Math.max(0,+v("f_a")||0)),motivoTipo:nd?v("f_mt"):"",motivo:nd?v("f_m"):""};
if(e==="Hecho"){n.prog=100;n.cierre=o.cierre||today()}else n.cierre=null;
n.hist=[...(o.hist||[])];if(!o.title||o.estado!==e)n.hist.push({f:today(),x:o.title?`${o.estado} → ${e}${nd?" ("+n.motivoTipo+": "+n.motivo+")":""}`:"Creada"});
save("tasks",JSON.parse(JSON.stringify(n)));$("dlg").close()}
function arch(id){if(!confirm("Se archiva (no se borra) y queda en el historial."))return;save("tasks",{...JSON.parse(JSON.stringify(tasks.find(x=>x.id===id))),archivada:true});$("dlg").close()}
function addP(){const n=$("pn").value.trim();if(!n)return;if(people.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert("Ya existe un responsable con ese nombre");save("people",{id:"p_"+slug(n),name:n,email:$("pe").value.trim()})}
function delP(id){if(tasks.some(t=>(t.resps||[]).includes(id)&&!["Hecho","Cancelado"].includes(t.estado)&&!t.archivada)&&!confirm("Tiene actividades abiertas. ¿Quitar igual?"))return;del("people",id)}
function saveRoom(){if(cur&&$("a_titulo"))readActa();save("cfg",{id:"main",roomUrl:$("ru").value.trim()})}
const NUEVOS=["Por hacer","En curso","Hecho"];let actas=[],cur=null,hold=false;
const blankA=()=>({id:"a"+uid(),num:"",titulo:"Reunión semanal de Riego",fecha:today(),hi:"",hf:"",lugar:"",temas:"",avances:"",prox:"",pres:{},ac:[{t:"",r:"",e:"Por hacer",f:""}],cb:[]});

d.cb=[...document.querySelectorAll(".cbw")].map((r,i)=>({...(d.cb[i]||{}),id:r.querySelector(".cs").value,e:r.querySelector(".ce").value,p:r.querySelector(".cp").value,mt:r.querySelector(".cmt").value,m:r.querySelector(".cm").value.trim()}));
try{localStorage.setItem("acta_draft",JSON.stringify(d))}catch(e){}}
function go(k){if(tab==="Reunión"&&$("a_titulo"))readActa();tab=k;render()}
function addA(){readActa();cur.ac.push({t:"",r:"",e:"Por hacer",f:""});render()}
function delA(i){readActa();cur.ac.splice(i,1);if(!cur.ac.length)cur.ac.push({t:"",r:"",e:"Por hacer",f:""});render()}
function addC(){readActa();cur.cb.push({id:"",e:"En curso"});render()}
function delC(i){readActa();cur.cb.splice(i,1);render()}
function nuevaActa(){if(confirm("Se limpia el formulario de la reunión. ¿Continuar?")){cur=blankA();render()}}
function abrirActa(id){cur=JSON.parse(JSON.stringify(actas.find(h=>h.id===id)));cur.cb=cur.cb||[];render();scrollTo(0,0)}
function stateOf(t,e,d,mt,m){if(NEEDS.includes(e)){t.motivoTipo=mt||"Otro";t.motivo=m}else{t.motivoTipo="";t.motivo=""}
if(t.estado!==e)t.hist=[...(t.hist||[]),{f:d.fecha,x:(t.estado?t.estado+" → ":"")+e+" ("+d.num+")"+(NEEDS.includes(e)?": "+t.motivoTipo+" - "+t.motivo:"")}];
t.estado=e;if(e==="Hecho"){t.prog=100;t.cierre=t.cierre||d.fecha}else t.cierre=null}
async function guardarActa(){readActa();const d=cur;if(!d.titulo.trim())return alert("Escribe el título de la reunión");
for(const c of d.cb){if(c.id&&NEEDS.includes(c.e)&&!c.m)return alert("Falta el motivo de una actividad que queda "+c.e.toLowerCase())}
if(!d.num){const y=(d.fecha||today()).slice(0,4);d.num="Acta "+String(actas.filter(h=>(h.num||"").endsWith("-"+y)).length+1).padStart(3,"0")+"-"+y}
hold=true;try{for(const a of d.ac){if(!a.t)continue;let t=tasks.find(x=>x.id===a.tid);if(!t){a.tid=uid();t={id:a.tid,title:a.t,desc:"Acordado en "+d.num+" ("+fd(d.fecha)+")",todos:false,cat:"Otro",prio:"Normal",inicio:d.fecha,prog:0,estado:"",motivoTipo:"",motivo:"",hist:[{f:d.fecha,x:"Creada en "+d.num}]}}else t=JSON.parse(JSON.stringify(t));
t.title=a.t;t.resps=a.r?[a.r]:[];t.venc=a.f||plus(d.fecha,7);stateOf(t,a.e,d);await save("tasks",t)}
for(const c of d.cb){const o=tasks.find(x=>x.id===c.id);if(!o)continue;const t=JSON.parse(JSON.stringify(o));if(c.prev===undefined)c.prev=o.estado;stateOf(t,c.e,d,c.mt,c.m);if(c.p!==""&&c.p!=null&&c.e!=="Hecho")t.prog=Math.min(100,Math.max(0,+c.p));await save("tasks",t)}
await save("actas",JSON.parse(JSON.stringify(d)));try{localStorage.setItem("acta_draft",JSON.stringify(d))}catch(e){}}finally{hold=false}
render();alert(d.num+" guardada. El tablero ya refleja los cambios.")}
function mailHtml(){const d=cur,by={},asis=people.filter(p=>d.pres[p.id]!==false&&p.email);d.ac.filter(a=>a.t&&a.r).forEach(a=>(by[a.r]=by[a.r]||[]).push(a));
const cam=d.cb.filter(c=>c.id).map(c=>`- ${(tasks.find(x=>x.id===c.id)||{}).title}: ${c.prev||"?"} → ${c.e}`).join("\n");
const res=`${d.num||"Acta"} · ${d.titulo} (${fd(d.fecha)})\n\nAvances y cambios:\n${d.avances||"—"}\n\nCambios de estado:\n${cam||"—"}\n\nAcuerdos:\n`+d.ac.filter(a=>a.t).map(a=>`- ${a.t} (${pname(a.r)}, límite ${fd(a.f)})`).join("\n");
let h=Object.keys(by).map(id=>{const p=people.find(x=>x.id===id);if(!p)return"";const b="Hola "+p.name+",\n\nPendientes de la reunión "+d.titulo+" ("+fd(d.fecha)+"):\n"+by[id].map(a=>"- "+a.t+" (límite "+fd(a.f)+")").join("\n")+"\n\nSaludos.";
return `<a class="btn s" style="text-decoration:none;display:inline-block;margin:3px" href="mailto:${encodeURIComponent(p.email||"")}?subject=${encodeURIComponent("Pendientes: "+d.titulo)}&body=${encodeURIComponent(b)}">Recordatorio a ${esc(p.name)}</a>`}).join("");
if(asis.length)h+=`<a class="btn" style="text-decoration:none;display:inline-block;margin:3px" href="mailto:${asis.map(p=>encodeURIComponent(p.email)).join(",")}?subject=${encodeURIComponent((d.num||"Acta")+" · "+d.titulo)}&body=${encodeURIComponent(res)}">Enviar resumen a los asistentes</a>`;
return h?"<b>Correos:</b><br>"+h:""}
function pdfActa(){readActa();const d=cur,pres=people.filter(p=>d.pres[p.id]!==false),aus=people.filter(p=>d.pres[p.id]===false),cb=d.cb.filter(c=>c.id);
$("acta").innerHTML=`<h2>HFE Berries Perú SAC · Riego y Mantenimiento</h2><h2 style="margin-top:6px">${esc(d.num||"Acta de reunión (borrador)")}</h2>
<table style="margin-top:8px"><tr><th>Reunión</th><td colspan=3>${esc(d.titulo)}</td></tr><tr><th>Fecha</th><td>${fd(d.fecha)}</td><th>Hora</th><td>${esc(d.hi||"—")} a ${esc(d.hf||"—")}</td></tr><tr><th>Lugar</th><td colspan=3>${esc(d.lugar||"—")}</td></tr></table>
<h3>Asistentes</h3><p>${pres.map(p=>esc(p.name)).join(", ")||"—"}${aus.length?`<br><i>Ausentes:</i> ${aus.map(p=>esc(p.name)).join(", ")}`:""}</p>
<h3>Temas tratados</h3><p>${esc(d.temas).replace(/\n/g,"<br>")||"—"}</p><h3>Avances y cambios</h3><p>${esc(d.avances).replace(/\n/g,"<br>")||"—"}</p>
${cb.length?`<h3>Cambios de estado</h3><table><tr><th>Actividad</th><th>Cambio</th><th>Avance</th><th>Motivo</th></tr>${cb.map(c=>{const t=tasks.find(x=>x.id===c.id)||{};return `<tr><td>${esc(t.title)}</td><td>${esc(c.prev||"")} → ${esc(c.e)}</td><td>${c.e==="Hecho"?100:(c.p===""||c.p==null?t.prog||0:c.p)}%</td><td>${NEEDS.includes(c.e)?esc(c.mt+": "+c.m):""}</td></tr>`}).join("")}</table>`:""}
<h3>Acuerdos</h3><table><tr><th>N°</th><th>Acuerdo</th><th>Responsable</th><th>Estado</th><th>Fecha límite</th></tr>${d.ac.filter(a=>a.t).map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.t)}</td><td>${esc(a.r?pname(a.r):"—")}</td><td>${esc(a.e)}</td><td>${fd(a.f||plus(d.fecha,7))}</td></tr>`).join("")||"<tr><td colspan=5>Sin acuerdos</td></tr>"}</table>
<h3>Próxima reunión</h3><p>${esc(d.prox||"—")}</p><div class="sig"><div>Elaborado por</div><div>Revisado por</div></div>`;setTimeout(()=>window.print(),200)}
function boot(){F.temp=temp(today());if(!remote){try{const d=JSON.parse(localStorage.getItem("riego_v3")||"{}");tasks=d.tasks||[];people=d.people||[];actas=d.actas||[];cfg=d.cfg||cfg}catch(e){}render()}else{render();load();setInterval(load,60000)}}
boot();
</script></body></html>
