<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><input id="pn" placeholder="Nombre"><input id="pe" placeholder="Correo corporativo"><button class="btn s" onclick="addP()">Agregar</button></div>
<table>${people.map(p=>`<tr><td><input value="${esc(p.name)}" onchange="updP('${p.id}','name',this.value)" aria-label="Nombre"></td><td><input value="${esc(p.cargo||"")}" placeholder="Cargo" onchange="updP('${p.id}','cargo',this.value)" aria-label="Cargo"></td><td><input value="${esc(p.tel||"")}" placeholder="Teléfono" onchange="updP('${p.id}','tel',this.value)" aria-label="Teléfono" style="max-width:130px"></td><td><input type="email" value="${esc(p.email||"")}" placeholder="correo@empresa.com" onchange="updP('${p.id}','email',this.value)" aria-label="Correo" style="min-width:220px"></td><td>${tasks.filter(t=>(t.resps||[]).includes(p.id)&&!["Hecho","Cancelado"].includes(t.estado)&&!t.archivada).length} abiertas</td><td><button class="btn d" onclick="delP('${p.id}')">Quitar</button></td></tr>`).join("")||"<tr><td>Aún no hay responsables</td></tr>"}</table></div>
<div class="panel"><b>Importar datos</b><br><span class="mut">Sube el Excel con las columnas originales (id, responsable, tema, descripcion, estado, prioridad, progreso, inicio, vence). Se puede repetir sin duplicar.</span><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><input type="file" accept=".xlsx,.csv" onchange="importFile(this)"><button class="btn s" onclick="loadSeed()">Cargar Excel original (${SEED.length})</button></div></div>`}};
function render(){if(hold)return;setSync();$("c1").textContent="Semana "+wk(today());$("c2").textContent="Temporada "+temp(today());
$("nav").innerHTML=Object.keys(views).map(k=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${k}</button>`).join("");
$("kp").innerHTML=kpis(filt());$("v").innerHTML=views[tab]();}
function edit(id){if(tab==="Reunión"&&cur&&$("a_titulo"))readActa();const nid=id||uid();const t=tasks.find(x=>x.id===id)||{title:"",desc:"",resps:[],cat:CATS[0],estado:"Por hacer",prio:"Normal",inicio:today(),fin:"",venc:"",prog:0,hist:[]};
$("dlg").innerHTML=`<h3 style="margin-top:0">${id?"Editar":"Nueva"} actividad</h3><label>Título</label><input id="f_t" value="${esc(t.title)}"><label>Descripción</label><textarea id="f_d" rows="3">${esc(t.desc)}</textarea>
<label>Responsables (puede haber más de uno)</label><div class="chk">${people.map(p=>`<label><input type="checkbox" class="f_rc" value="${p.id}" ${(t.resps||[]).includes(p.id)?"checked":""}> ${esc(p.name)}</label>`).join("")}<label><input type="checkbox" id="f_td" ${t.todos?"checked":""}> <b>Todo el equipo</b></label></div>
<div class="row2"><div><label>Categoría</label><select id="f_c">${opts(CATS,t.cat)}</select></div><div><label>Prioridad</label><select id="f_p">${opts(PRIOS,t.prio)}</select></div>
<div><label>Estado</label><select id="f_e" onchange="$('mo').style.display=NEEDS.includes(this.value)?'block':'none'">${opts(Object.keys(ESTADOS),t.estado)}</select></div><div><label>Avance (0-100)</label><input type="number" min="0" max="100" id="f_a" value="${t.prog||0}"></div>
<div><label>Fecha de inicio</label><input type="date" id="f_i" value="${t.inicio||""}"></div><div><label>Fecha de vencimiento (opcional)</label><input type="date" id="f_v" value="${t.venc||""}"></div></div>
<div id="mo" style="display:${NEEDS.includes(t.estado)?"block":"none"}"><label>Motivo (obligatorio)</label><select id="f_mt">${opts(MOTIVOS,t.motivoTipo)}</select><textarea id="f_m" rows="2" style="width:100%;margin-top:6px" placeholder="Detalle: qué falta para retomarla">${esc(t.motivo||"")}</textarea></div>
${id?`<label>Fecha del cambio (para el acta de esa reunión)</label><input type="date" id="f_fc" value="${today()}"><div class="mut" style="margin-top:3px">Si no cambias estado, avance ni fechas, esta fecha se aplica al último cambio del historial.</div>`:""}
${(t.hist||[]).length?`<label>Historial</label><div class="mut" style="margin-bottom:4px">Puedes corregir la fecha de cualquier cambio.</div>${t.hist.map((h,i)=>({h,i})).reverse().map(({h,i})=>`<div style="display:flex;gap:8px;align-items:center;margin:3px 0"><input type="date" class="hd" data-i="${i}" value="${h.f||""}" style="width:150px"><span class="mut">${esc(h.x)}</span></div>`).join("")}`:""}
<div style="display:flex;justify-content:space-between;margin-top:14px"><span>${id?`<button class="btn d" onclick="arch('${id}')">Archivar</button>`:""}</span><span><button class="btn" onclick="$('dlg').close()">Cancelar</button> <button class="btn s" id="f_save" onclick="saveT('${nid}')">Guardar</button></span></div>`;$("dlg").showModal()}
function saveT(id){const o=tasks.find(x=>x.id===id)||{id,hist:[]},v=i=>$(i).value,e=v("f_e"),nd=NEEDS.includes(e),fc=$("f_fc")&&$("f_fc").value||today();
if(!v("f_t").trim())return alert("Falta el título");if(!v("f_i"))return alert("Falta la fecha de inicio");if(v("f_v")&&v("f_v")<v("f_i"))return alert("El vencimiento no puede ser anterior al inicio");if(nd&&!v("f_m").trim())return alert("Indica el motivo de este estado");
const n={...o,title:v("f_t").trim(),desc:v("f_d"),resps:[...document.querySelectorAll(".f_rc:checked")].map(c=>c.value),todos:$("f_td").checked,cat:v("f_c"),estado:e,prio:v("f_p"),inicio:v("f_i"),venc:v("f_v"),prog:Math.min(100,Math.max(0,+v("f_a")||0)),motivoTipo:nd?v("f_mt"):"",motivo:nd?v("f_m"):""};
if(e==="Hecho"){n.prog=100;n.cierre=o.cierre||fc}else n.cierre=null;
n.hist=(o.hist||[]).map(h=>({...h}));document.querySelectorAll(".hd").forEach(el=>{const h=n.hist[+el.dataset.i];if(h&&el.value)h.f=el.value});const base=n.hist.length;if(!o.title||o.estado!==e)n.hist.push({f:o.title?fc:today(),x:o.title?`${o.estado} → ${e}${nd?" ("+n.motivoTipo+": "+n.motivo+")":""}`:"Creada"});
if(!tasks.some(x=>x.id===id)){const k=slug(n.title),dup=tasks.find(x=>!x.archivada&&slug(x.title)===k&&wk(ref(x))===wk(ref(n)));if(dup&&!confirm("Ya existe una actividad igual en esa semana: «"+dup.title+"» ("+dup.estado+").\n¿Crear otra de todos modos?"))return}
if(o.title){if(e===o.estado&&(o.prog||0)!==n.prog)n.hist.push({f:fc,x:"Avance "+(o.prog||0)+"% → "+n.prog+"%"});if((o.venc||"")!==(n.venc||""))n.hist.push({f:fc,x:"Vencimiento "+fd(o.venc)+" → "+fd(n.venc)})}
if(o.title&&n.hist.length===base&&fc!==today()){for(let i=n.hist.length-1;i>=0;i--){if(!/^(Creada|Importada)/.test(n.hist[i].x)){n.hist[i].f=fc;break}}}
$("f_save").disabled=true;save("tasks",JSON.parse(JSON.stringify(n)));$("dlg").close();reveal(n)}
function arch(id){if(!confirm("Se archiva (no se borra) y queda en el historial."))return;save("tasks",{...JSON.parse(JSON.stringify(tasks.find(x=>x.id===id))),archivada:true});$("dlg").close()}
function updP(id,k,v){const p=people.find(x=>x.id===id);if(!p)return;v=v.trim();if(k==="name"&&!v)return render();if(k==="email"&&v&&!/^\S+@\S+\.\S+$/.test(v)){alert("El correo no es válido");return render()}save("people",{...p,[k]:v})}
function addP(){const n=$("pn").value.trim();if(!n)return;if(people.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert("Ya existe un responsable con ese nombre");save("people",{id:"p_"+slug(n),name:n,email:$("pe").value.trim()})}
function delP(id){if(tasks.some(t=>(t.resps||[]).includes(id)&&!["Hecho","Cancelado"].includes(t.estado)&&!t.archivada)&&!confirm("Tiene actividades abiertas. ¿Quitar igual?"))return;del("people",id)}
function saveRoom(){if(cur&&$("a_titulo"))readActa();save("cfg",{id:"main",roomUrl:$("ru").value.trim()})}
let actas=[],cur=null,hold=false;
const blankA=()=>({id:"a"+uid(),num:"",tipo:"Ordinaria",comite:"Riego y Mantenimiento",citada:"",coord:"",fecha:today(),hi:"",hf:"",lugar:"",temas:"",prox:"",pres:{},ex:[]});
function draftA(){try{const d=JSON.parse(localStorage.getItem("acta_draft")||"null");if(d&&d.comite!==undefined)return d}catch(e){}return blankA()}
const AF=["tipo","comite","citada","coord","fecha","hi","hf","lugar","temas","prox"];
function readActa(){const d=cur;AF.forEach(k=>{const e=$("a_"+k);if(e)d[k]=e.value});d.titulo="Reunión "+d.tipo.toLowerCase()+" · "+d.comite;d.pres={};document.querySelectorAll(".pc").forEach(c=>d.pres[c.dataset.id]=c.checked);
const px=[...document.querySelectorAll(".px")];if(px.length)d.ex=[...new Set([...(d.ex||[]).filter(i=>!px.some(c=>c.dataset.id===i)),...px.filter(c=>!c.checked).map(c=>c.dataset.id)])];
try{localStorage.setItem("acta_draft",JSON.stringify(d))}catch(e){}}
function calcAll(d){const f=d.fecha,ex=d.ex||[],act=[],nue=[];tasks.filter(t=>!t.archivada).forEach(t=>{const h=(t.hist||[]).filter(x=>x.f===f),b={id:t.id,title:t.title,resps:t.resps||[],todos:t.todos,estado:t.estado,prog:t.prog,inicio:t.inicio,venc:t.venc,inc:!ex.includes(t.id)};
if(t.inicio===f||h.some(x=>/^Creada/.test(x.x))){nue.push(b);return}const c=h.filter(x=>!/^Importada/.test(x.x)).map(x=>x.x);if(c.length)act.push({...b,cambios:c})});return{act,nue}}
function go(k){if(tab==="Reunión"&&$("a_fecha"))readActa();tab=k;render()}
function nuevaActa(){if(confirm("Se limpia el formulario de la reunión. ¿Continuar?")){cur=blankA();render()}}
function abrirActa(id){cur=JSON.parse(JSON.stringify(actas.find(h=>h.id===id)));if(cur.comite===undefined)Object.assign(cur,{tipo:"Ordinaria",comite:"Riego y Mantenimiento",citada:"",coord:"",ex:[]});render();scrollTo(0,0)}
async function guardarActa(){readActa();const d=cur;if(!d.num){const y=(d.fecha||today()).slice(0,4);d.num="Acta "+String(actas.filter(h=>(h.num||"").endsWith("-"+y)).length+1).padStart(3,"0")+"-"+y}
await save("actas",JSON.parse(JSON.stringify(d)));try{localStorage.setItem("acta_draft",JSON.stringify(d))}catch(e){}toast("✓ "+d.num+" guardada")}
function mailHtml(){const d=cur,L=calcAll(d),nue=L.nue.filter(x=>x.inc),act=L.act.filter(x=>x.inc),by={},asis=people.filter(p=>d.pres[p.id]!==false&&p.email);
nue.forEach(x=>(x.resps||[]).forEach(id=>(by[id]=by[id]||[]).push(x)));
const res=`${d.num||"Acta"} · ${d.titulo} (${fd(d.fecha)})\n\nActividades actualizadas:\n${act.map(x=>`- ${x.title}: ${x.cambios.join("; ")}`).join("\n")||"—"}\n\nActividades nuevas:\n${nue.map(x=>`- ${x.title} (${x.todos?"Todo el equipo":(x.resps||[]).map(pname).join(", ")||"sin asignar"}, vence ${fd(x.venc)})`).join("\n")||"—"}\n\nDesarrollo:\n${d.temas||"—"}`;
let h=Object.keys(by).map(id=>{const p=people.find(x=>x.id===id);if(!p)return"";const b="Hola "+p.name+",\n\nPendientes de la reunión del "+fd(d.fecha)+":\n"+by[id].map(a=>"- "+a.title+" (vence "+fd(a.venc)+")").join("\n")+"\n\nSaludos.";
return `<a class="btn s" style="text-decoration:none;display:inline-block;margin:3px" href="mailto:${encodeURIComponent(p.email||"")}?subject=${encodeURIComponent("Pendientes: "+d.titulo)}&body=${encodeURIComponent(b)}">Recordatorio a ${esc(p.name)}</a>`}).join("");
if(asis.length)h+=`<a class="btn" style="text-decoration:none;display:inline-block;margin:3px" href="mailto:${asis.map(p=>encodeURIComponent(p.email)).join(",")}?subject=${encodeURIComponent((d.num||"Acta")+" · "+d.titulo)}&body=${encodeURIComponent(res)}">Enviar resumen a los asistentes</a>`;
return h?"<b>Correos:</b><br>"+h:""}
function pdfActa(){readActa();const d=cur,L=calcAll(d),act=L.act.filter(x=>x.inc),nue=L.nue.filter(x=>x.inc),pres=people.filter(p=>d.pres[p.id]!==false),pl=r=>esc(r.todos?"Todo el equipo":(r.resps||[]).map(pname).join(", ")||"Sin asignar"),b=s=>esc(s||"");
$("acta").innerHTML=`<table class="at"><tr><th colspan=2 class="bar">ACTA DE REUNIÓN ${esc(d.tipo.toUpperCase())}</th></tr><tr><td>Comité o grupo: <b>${b(d.comite)}</b></td><td>Acta No: <b>${b(d.num||"(borrador)")}</b></td></tr>
<tr><td>Solicitante: <b>${b(d.citada)}</b></td><td>Fecha: <b>${fd(d.fecha)}</b></td></tr><tr><td>Coordinador: <b>${b(d.coord)}</b></td><td>Hora inicio: <b>${b(d.hi)}</b> &nbsp;&nbsp; Fin: <b>${b(d.hf)}</b></td></tr><tr><td colspan=2>Lugar: <b>${b(d.lugar)}</b></td></tr></table>
<table class="at"><tr><th colspan=4 class="bar">PARTICIPANTES</th></tr><tr><th style="width:40px">No.</th><th>Nombre</th><th>Cargo</th><th>Teléfono</th></tr>${pres.map((p,i)=>`<tr><td>${i+1}</td><td>${b(p.name)}</td><td>${b(p.cargo)}</td><td>${b(p.tel)}</td></tr>`).join("")||"<tr><td colspan=4>—</td></tr>"}</table>
<table class="at"><tr><th colspan=4 class="bar">AGENDA · ACTIVIDADES ACTUALIZADAS</th></tr>${act.map((x,i)=>`<tr><td style="width:40px">${i+1}</td><td><b>${b(x.title)}</b><br>${esc(x.cambios.join(" · "))}</td><td style="width:22%">${pl(x)}</td><td style="width:60px">${x.prog||0}%</td></tr>`).join("")||"<tr><td colspan=4>Sin actividades actualizadas</td></tr>"}</table>
<table class="at"><tr><th colspan=5 class="bar">ACTIVIDADES NUEVAS (ACUERDOS)</th></tr><tr><th style="width:40px">No.</th><th>Actividad</th><th>Responsable</th><th>Estado</th><th>Fecha límite</th></tr>${nue.map((x,i)=>`<tr><td>${i+1}</td><td>${b(x.title)}</td><td>${pl(x)}</td><td>${b(x.estado)}</td><td>${fd(x.venc)}</td></tr>`).join("")||"<tr><td colspan=5>Sin actividades nuevas</td></tr>"}</table>
<table class="at"><tr><th class="bar">DESARROLLO DE LA REUNIÓN</th></tr><tr><td style="height:110px">${esc(d.temas).replace(/\n/g,"<br>")}</td></tr></table>
<p>Próxima reunión: <b>${b(d.prox)||"—"}</b></p><div class="sig"><div>Solicitante</div><div>Coordinador</div></div>`;setTimeout(()=>window.print(),200)}
function boot(){F.temp=temp(today());if(!remote){try{const d=JSON.parse(localStorage.getItem("riego_v3")||"{}");tasks=d.tasks||[];people=d.people||[];actas=d.actas||[];cfg=d.cfg||cfg}catch(e){}render()}else{render();flushQ();load();setInterval(()=>{if(document.visibilityState==="visible")load()},60000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){flushQ();load()}});addEventListener("beforeunload",e=>{if(outbox.length){e.preventDefault();e.returnValue=""}})}}
boot();
</script></body></html>
